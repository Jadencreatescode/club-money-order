name: Update Money Order Pars

on:
  workflow_dispatch:
    inputs:
      atm_1:
        description: ATM 1 par, blank keeps current
        required: false
        default: ""
      atm_2:
        description: ATM 2 par, blank keeps current
        required: false
        default: ""
      atm_3:
        description: ATM 3 par, blank keeps current
        required: false
        default: ""
      atm_4:
        description: ATM 4 par, blank keeps current
        required: false
        default: ""
      monday_hundreds:
        description: Monday hundreds par, blank keeps current
        required: false
        default: ""
      monday_twenties:
        description: Monday twenties par, blank keeps current
        required: false
        default: ""
      monday_tens:
        description: Monday tens par, blank keeps current
        required: false
        default: ""
      monday_fives:
        description: Monday fives par, blank keeps current
        required: false
        default: ""
      monday_ones:
        description: Monday ones par, blank keeps current
        required: false
        default: ""
      thursday_hundreds:
        description: Thursday hundreds par, blank keeps current
        required: false
        default: ""
      thursday_twenties:
        description: Thursday twenties par, blank keeps current
        required: false
        default: ""
      thursday_tens:
        description: Thursday tens par, blank keeps current
        required: false
        default: ""
      thursday_fives:
        description: Thursday fives par, blank keeps current
        required: false
        default: ""
      thursday_ones:
        description: Thursday ones par, blank keeps current
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate and save pars
        env:
          ATM_1: ${{ inputs.atm_1 }}
          ATM_2: ${{ inputs.atm_2 }}
          ATM_3: ${{ inputs.atm_3 }}
          ATM_4: ${{ inputs.atm_4 }}
          MONDAY_HUNDREDS: ${{ inputs.monday_hundreds }}
          MONDAY_TWENTIES: ${{ inputs.monday_twenties }}
          MONDAY_TENS: ${{ inputs.monday_tens }}
          MONDAY_FIVES: ${{ inputs.monday_fives }}
          MONDAY_ONES: ${{ inputs.monday_ones }}
          THURSDAY_HUNDREDS: ${{ inputs.thursday_hundreds }}
          THURSDAY_TWENTIES: ${{ inputs.thursday_twenties }}
          THURSDAY_TENS: ${{ inputs.thursday_tens }}
          THURSDAY_FIVES: ${{ inputs.thursday_fives }}
          THURSDAY_ONES: ${{ inputs.thursday_ones }}
        run: python3 .github/scripts/update_pars.py
      - name: Verify calculations
        run: node --test
      - name: Publish changes
        run: |
          git config user.name "Money Order Back Office"
          git config user.email "actions@users.noreply.github.com"
          git add pars.json
          if git diff --cached --quiet; then
            echo "Pars already match these values."
            exit 0
          fi
          git commit -m "Update money order pars"
          git push
